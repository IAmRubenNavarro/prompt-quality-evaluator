name: Deploy to Azure

on:
  push:
    branches:
      - master

env:
  AZURE_RESOURCE_GROUP: prompt-quality-evaluator-rg
  AZURE_LOCATION: eastus
  CONTAINER_REGISTRY: promptqualityevaluator
  CONTAINER_APP_NAME: prompt-quality-evaluator
  CONTAINER_APP_ENV: prompt-quality-evaluator-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_NAME=${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:$IMAGE_TAG
          IMAGE_LATEST=${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest

          docker build -f infra/Dockerfile -t $IMAGE_NAME -t $IMAGE_LATEST .
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST

          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update Container App
        run: |
          # Check if Container App Environment exists
          ENV_EXISTS=$(az containerapp env list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?name=='${{ env.CONTAINER_APP_ENV }}'].name" -o tsv)

          if [ -z "$ENV_EXISTS" ]; then
            echo "Creating Container App Environment..."
            az containerapp env create \
              --name ${{ env.CONTAINER_APP_ENV }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }}
          fi

          # Check if Container App exists
          APP_EXISTS=$(az containerapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?name=='${{ env.CONTAINER_APP_NAME }}'].name" -o tsv)

          if [ -z "$APP_EXISTS" ]; then
            echo "Creating Container App..."
            az containerapp create \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_APP_ENV }} \
              --image ${{ steps.build-image.outputs.image }} \
              --target-port 8000 \
              --ingress external \
              --cpu 1.0 \
              --memory 2.0Gi \
              --min-replicas 0 \
              --max-replicas 10 \
              --registry-server ${{ env.CONTAINER_REGISTRY }}.azurecr.io \
              --env-vars \
                OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
                OPENROUTER_BASE_URL="${{ secrets.OPENROUTER_BASE_URL }}" \
                ANTHROPIC_LLM_MODEL="${{ secrets.ANTHROPIC_LLM_MODEL }}" \
                GOOGLE_LLM_MODEL="${{ secrets.GOOGLE_LLM_MODEL }}" \
                OPENAI_LLM_MODEL="${{ secrets.OPENAI_LLM_MODEL }}" \
                ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}"
          else
            echo "Updating Container App..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ steps.build-image.outputs.image }} \
              --set-env-vars \
                OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
                OPENROUTER_BASE_URL="${{ secrets.OPENROUTER_BASE_URL }}" \
                ANTHROPIC_LLM_MODEL="${{ secrets.ANTHROPIC_LLM_MODEL }}" \
                GOOGLE_LLM_MODEL="${{ secrets.GOOGLE_LLM_MODEL }}" \
                OPENAI_LLM_MODEL="${{ secrets.OPENAI_LLM_MODEL }}" \
                ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}"
          fi

      - name: Get Container App URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "✓ Deployment successful!"
          echo "Service URL: https://$FQDN"